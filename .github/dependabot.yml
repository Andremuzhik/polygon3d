# Версионные обновления Dependabot отключены: PR от бота не нужны.
# Уязвимости в зависимостях и Docker-образе проверяет еженедельный workflow Security
# (pip-audit, Trivy), версии закреплены хешами в requirements.txt (обновление: `make lock`).
# Чтобы вернуть обновления, уберите `ignore` и `open-pull-requests-limit` у нужной экосистемы.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
