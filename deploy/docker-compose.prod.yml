# Production: запускается на сервере из CI/CD (см. .github/workflows/ci-cd.yml).
# Рядом должен лежать .env (создаётся один раз вручную, в репозиторий не попадает).
name: studio3d

x-app: &app
  image: ${IMAGE}:${TAG:-latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s  # первый старт включает initdb, на слабом сервере он бывает долгим

  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
      DJANGO_BEHIND_PROXY: "1"  # порт web наружу не опубликован, клиентский IP берём из X-Forwarded-For Caddy
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    <<: *app
    command: python manage.py runbot
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
