# Локальная разработка: docker compose up --build
name: studio3d-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      DJANGO_DEBUG: "1"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: python manage.py runbot
    env_file: .env
    environment:
      DJANGO_DEBUG: "1"
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  media:
