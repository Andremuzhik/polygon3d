title = "Polygon3D"

[extend]
useDefault = true

# Заведомо фиктивные значения: одноразовый ключ smoke-теста и пароль из теста регистрации.
# Список узкий (конкретные строки), чтобы настоящие секреты по-прежнему находились.
[allowlist]
description = "Фиктивные значения в тестах"
regexes = [
  '''smoke-test-secret-key-[0-9a-f]+''',
  '''very-Strong-pass-77''',
  '''Journey-pass-4821''',  # пароль тестового клиента в e2e/test_journey.py
]
